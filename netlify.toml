# Netlify deploys only the static React frontend in frontend/.
# The FastAPI backend and the NASA data it needs do not run on Netlify: host the
# backend separately and point the site at it with the VITE_API_BASE_URL build
# environment variable (see README, "Netlify'da yayınlama").

[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Vite 8 needs Node >= 20.19; 24 is the version the project is built and tested with.
  NODE_VERSION = "24"

# Single-page app: any path without a matching file serves index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
